server {
    listen 8080;
    server_tokens off;
    client_max_body_size 60m;

    # Cabeceras de seguridad. blob: hace falta para el AudioWorklet de la grabadora.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "microphone=(self), display-capture=(self), camera=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # La API se sirve bajo /api para evitar CORS: el navegador solo habla con este origen.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    # Asistente en vivo (módulo 3), también bajo este origen. El destino se resuelve en cada petición: si el
    # contenedor no existe, solo falla /assistant/ (502) y el resto de la web arranca con normalidad.
    # Sin buffering y con lectura larga: el flujo de eventos (SSE) debe llegar al navegador al instante.
    location /assistant/ {
        resolver 127.0.0.11 valid=10s;
        resolver_timeout 3s;  # asistente caído: 502 enseguida en lugar de esperar 30 s
        set $assistant_upstream http://assistant:8200;
        rewrite ^/assistant/(.*)$ /$1 break;
        proxy_pass $assistant_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        # add_header en un location anula los del server: se repiten las de seguridad.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "microphone=(self), display-capture=(self), camera=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header en un location anula los del server: se repiten las de seguridad.
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
