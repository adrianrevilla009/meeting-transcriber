# Red 'backend' interna (sin salida a Internet). Solo la API se publica, y solo en 127.0.0.1.
x-app: &app
  build: ./modules/transcriber
  env_file: .env
  environment:
    MT_DATABASE_URL: postgresql+psycopg://mt:${POSTGRES_PASSWORD}@db:5432/mt
    MT_AUDIO_DIR: /data/audio
    MT_EXPORT_DIR: /data/exports
    MT_WHISPER_MODELS_DIR: /data/models
    MT_OLLAMA_URL: http://ollama:11434
    HF_HOME: /data/hf  # caché de Hugging Face en un volumen escribible (el usuario mt no tiene home)
  volumes: [appdata:/data]
  depends_on: [db]

services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: mt, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: mt }
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    restart: unless-stopped

  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    networks: [backend, edge]  # edge solo existe para poder publicar el puerto en localhost
    restart: unless-stopped

  worker:
    <<: *app
    command: ["python", "-m", "transcriber.bootstrap.worker"]
    healthcheck:
      disable: true  # la imagen trae el healthcheck HTTP de la API; el worker no sirve HTTP
    networks: [backend]
    restart: unless-stopped

  # Frontal React servido por nginx; /api se redirige a la API (sin CORS). Solo en localhost.
  web:
    build: ./modules/transcriber/web
    ports: ["127.0.0.1:3000:8080"]
    networks: [edge, assist]
    depends_on: [api]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    networks: [backend]
    restart: unless-stopped

  # Módulo 2 (privacy-shield): proxy de ofuscación hacia LLMs externos. Perfil opcional:
  #   docker compose --profile shield up -d --build privacy-shield   (o: make shield-up)
  # Es el ÚNICO servicio con salida a Internet (red 'edge'); solo se publica en 127.0.0.1.
  privacy-shield:
    build: ./modules/privacy-shield
    profiles: [shield]
    environment:
      ANON_API_TOKEN: ${ANON_API_TOKEN:-change-me}
      ANON_DEFAULT_PROVIDER: ${ANON_DEFAULT_PROVIDER:-anthropic}
      ANON_OPENAI_API_KEY: ${ANON_OPENAI_API_KEY:-}
      ANON_ANTHROPIC_API_KEY: ${ANON_ANTHROPIC_API_KEY:-}
      ANON_OLLAMA_URL: ${ANON_OLLAMA_URL:-http://host.docker.internal:11434}
      ANON_VAULT: ${ANON_VAULT:-memory}
      ANON_SKIP_LOCAL: ${ANON_SKIP_LOCAL:-true}
      ANON_OLLAMA_MODEL: ${ANON_OLLAMA_MODEL:-qwen2.5:7b}
      ANON_DEBUG_MAPPING: ${ANON_DEBUG_MAPPING:-false}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [shielddata:/data]
    ports: ["127.0.0.1:8100:8100"]
    networks: [edge, assist]  # assist: solo el asistente y la web hablan con él
    restart: unless-stopped

  # Módulo 3 (realtime-assistant): sigue la reunión, detecta preguntas y sugiere respuestas.
  # SIN salida a Internet (redes internas): solo habla con el transcriber, privacy-shield y Ollama.
  #   docker compose --profile shield up -d --build privacy-shield assistant   (o: make assistant-up)
  assistant:
    build: ./modules/realtime-assistant
    profiles: [shield]
    environment:
      RTA_API_TOKEN: ${MT_API_TOKEN}  # el mismo token de la UI
      RTA_TRANSCRIBER_URL: http://api:8000
      RTA_SHIELD_URL: http://privacy-shield:8100
      RTA_SHIELD_TOKEN: ${ANON_API_TOKEN:-change-me}
      RTA_SHIELD_PROVIDER: ${RTA_SHIELD_PROVIDER:-}
      RTA_OLLAMA_URL: http://ollama:11434
      RTA_OLLAMA_MODEL: ${RTA_OLLAMA_MODEL:-qwen2.5:3b}
      RTA_CLASSIFIER: ${RTA_CLASSIFIER:-ollama}
      RTA_USER_NAMES: ${RTA_USER_NAMES:-}
      RTA_PROFILE: ${RTA_PROFILE:-}
      RTA_AUTO_ANSWER: ${RTA_AUTO_ANSWER:-true}
    networks: [backend, assist]
    depends_on: [api]
    restart: unless-stopped

  # --- Descarga de modelos (solo con red). Ejecutar una vez: docker compose --profile setup run --rm models
  models:
    <<: *app
    profiles: [setup]
    command: ["python", "-m", "transcriber.bootstrap.download_models"]
    networks: [edge]
  ollama-pull:
    image: ollama/ollama:latest
    profiles: [setup]
    entrypoint: ["sh", "-c", "ollama serve & sleep 5 && ollama pull ${MT_OLLAMA_MODEL:-qwen2.5:7b}"]
    volumes: [ollama:/root/.ollama]
    networks: [edge]

networks:
  backend: { internal: true }
  assist: { internal: true }  # web <-> asistente <-> privacy-shield
  edge: {}

volumes: { pgdata: {}, appdata: {}, ollama: {}, shielddata: {} }
