name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-quality:
    name: API (lint, tipos, seguridad)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/transcriber
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modules/transcriber/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: |
          for c in "ruff check ." "mypy" "lint-imports" "bandit -q -r src -c pyproject.toml"; do $c || echo "$c" >> failed.txt; done 2>&1 | tee out.txt
          test ! -f failed.txt
      - name: Anotar fallos
        if: failure()
        run: |
          { cat failed.txt; grep -vE '^(Found|All checks|Success|No issues)' out.txt | head -40; } | cut -c1-300 | while IFS= read -r l; do echo "::error::$l"; done
      - run: ruff format --check .
        continue-on-error: true # informativo hasta que se formatee todo el código
      - run: pip-audit
        continue-on-error: true # depende de avisos externos; no debe bloquear

  api:
    name: API (unit + integración)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/transcriber
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modules/transcriber/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: |
          set -o pipefail
          pytest --cov=transcriber --cov-report=term-missing 2>&1 | tee out.txt
      - name: Anotar fallos
        if: failure()
        run: |
          { grep -E '^(FAILED|ERROR|E  )' out.txt | head -25; tail -5 out.txt; } | cut -c1-300 | while IFS= read -r l; do echo "::error::$l"; done

  web:
    name: Web (lint, tipos, build, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/transcriber/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modules/transcriber/web/package-lock.json
      - run: npm ci
      - run: |
          for s in lint format:check typecheck build test; do npm run "$s" || echo "$s" >> failed.txt; done 2>&1 | tee out.txt
          test ! -f failed.txt
      - name: Anotar fallos
        if: failure()
        run: |
          { cat failed.txt; for f in $(npx prettier --list-different .); do npx prettier "$f" | diff "$f" - | head -30; done; grep -iE 'error|fail|warn|✗|×|threshold' out.txt | head -25; tail -8 out.txt; } | cut -c1-300 | while IFS= read -r l; do echo "::error::$l"; done

  shield-quality:
    name: Shield (lint, tipos, arquitectura, seguridad)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/privacy-shield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modules/privacy-shield/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: |
          for c in "ruff check --output-format=concise ." "mypy" "lint-imports" "bandit -q -r src -c pyproject.toml"; do $c || echo "$c" >> failed.txt; done 2>&1 | tee out.txt
          test ! -f failed.txt
      - name: Anotar fallos
        if: failure()
        run: |
          body=$( { cat failed.txt; grep -vE '^(Found|All checks|Success|No issues)' out.txt | head -60; } | cut -c1-250 | head -c 3800 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Fallos de calidad::$body"
      - run: ruff format --check .
        continue-on-error: true # informativo hasta que se formatee todo el código
      - run: pip-audit
        continue-on-error: true # depende de avisos externos; no debe bloquear

  shield-tests:
    name: Shield (tests + evaluación de fugas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/privacy-shield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modules/privacy-shield/pyproject.toml
      - run: pip install -e ".[dev,ner]"
      - run: pip install "https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl"
      - run: |
          set -o pipefail
          pytest --cov=privacy_shield --cov-report=term-missing 2>&1 | tee out.txt
      - name: Anotar fallos
        if: failure()
        run: |
          body=$( { grep -E '^(FAILED|ERROR|E  )' out.txt | head -40; tail -5 out.txt; } | cut -c1-250 | head -c 3800 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Fallos de pytest::$body"
      - name: Evaluación de fugas (informe)
        run: |
          python -m eval.run_eval 2>&1 | tee eval.txt
          split -b 3000 eval.txt part_
          for f in part_*; do echo "::notice title=Informe de evaluación $f::$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")"; done
      - uses: actions/upload-artifact@v4
        with:
          name: informe-evaluacion
          path: modules/privacy-shield/eval/reports/

  assistant-quality:
    name: Assistant (lint, tipos, arquitectura, seguridad)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/realtime-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modules/realtime-assistant/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: |
          for c in "ruff check --output-format=concise ." "mypy" "lint-imports" "bandit -q -r src -c pyproject.toml"; do $c || echo "$c" >> failed.txt; done 2>&1 | tee out.txt
          test ! -f failed.txt
      - name: Anotar fallos
        if: failure()
        run: |
          body=$( { cat failed.txt; grep -vE '^(Found|All checks|Success|No issues)' out.txt | head -60; } | cut -c1-250 | head -c 3800 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Fallos de calidad::$body"
      - run: pip-audit
        continue-on-error: true # depende de avisos externos; no debe bloquear

  assistant-tests:
    name: Assistant (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/realtime-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modules/realtime-assistant/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: |
          set -o pipefail
          pytest --cov=realtime_assistant --cov-report=term-missing 2>&1 | tee out.txt
      - name: Anotar fallos
        if: failure()
        run: |
          body=$( { grep -E '^(FAILED|ERROR|E  )' out.txt | head -40; tail -5 out.txt; } | cut -c1-250 | head -c 3800 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Fallos de pytest::$body"

  docker:
    name: Docker (hadolint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: modules/transcriber/Dockerfile
          config: .hadolint.yaml
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: modules/transcriber/web/Dockerfile
          config: .hadolint.yaml
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: modules/privacy-shield/Dockerfile
          config: .hadolint.yaml
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: modules/realtime-assistant/Dockerfile
          config: .hadolint.yaml
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: modules/transcriber
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: modules/transcriber/web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: docker/build-push-action@v6
        with:
          context: modules/privacy-shield
          push: false
          cache-from: type=gha,scope=shield
          cache-to: type=gha,mode=max,scope=shield
      - uses: docker/build-push-action@v6
        with:
          context: modules/realtime-assistant
          push: false
          cache-from: type=gha,scope=assistant
          cache-to: type=gha,mode=max,scope=assistant

  e2e:
    name: E2E (stack completo en Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_COMPOSE: docker compose -f docker-compose.yml -f e2e/docker-compose.e2e.yml --profile shield
      E2E_SERVICES: db api worker web privacy-shield assistant stub-llm
      MT_API_TOKEN: e2e-mt-token-0123456789abcdef
      ANON_API_TOKEN: e2e-anon-token-0123456789abcdef
      POSTGRES_PASSWORD: e2e-postgres-password
    steps:
      - uses: actions/checkout@v4
      - name: Configurar el stack (tokens de prueba, sin secretos reales)
        run: |
          cp .env.example .env
          {
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "MT_API_TOKEN=$MT_API_TOKEN"
            echo "ANON_API_TOKEN=$ANON_API_TOKEN"
          } >> .env
      - name: Construir y levantar el stack
        run: |
          $E2E_COMPOSE up -d db
          until $E2E_COMPOSE exec -T db pg_isready -U mt; do sleep 2; done
          $E2E_COMPOSE up -d --build $E2E_SERVICES
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements.txt
      - run: pip install -r e2e/requirements.txt
      - name: Tests E2E de API (módulos 1, 2 y 3 juntos)
        working-directory: e2e
        run: |
          set -o pipefail
          pytest 2>&1 | tee out.txt
      - name: Anotar fallos de la API
        if: failure()
        working-directory: e2e
        run: |
          body=$( { grep -E '^(FAILED|ERROR|E  )' out.txt | head -40; tail -5 out.txt; } | cut -c1-250 | head -c 3800 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Fallos de los E2E de API::$body"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modules/transcriber/web/package-lock.json
      - name: Instalar dependencias del navegador
        working-directory: modules/transcriber/web
        run: npm ci
      - name: Tests E2E de navegador (Chrome, micrófono falso)
        working-directory: modules/transcriber/web
        env:
          MT_E2E_STUB: "1"
        run: |
          set -o pipefail
          npx playwright test e2e/stack.spec.ts 2>&1 | tee pw.txt
      - name: Anotar fallos del navegador
        if: failure()
        working-directory: modules/transcriber/web
        run: |
          body=$(grep -vE '^\s*$' pw.txt | tail -70 | cut -c1-220 | head -c 3800 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Fallos de los E2E de navegador::$body"
      - name: Diagnóstico del stack
        if: failure()
        run: |
          body=$($E2E_COMPOSE ps -a --format '{{.Service}}: {{.Status}}' 2>&1 | head -c 1500 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Estado de los contenedores::$body"
          for s in web stub-llm worker; do
            body=$($E2E_COMPOSE logs --no-color --tail=30 $s 2>&1 | grep -v 'GET /health' | cut -c1-220 | tail -c 1800 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Logs de $s::$body"
          done
          body=$($E2E_COMPOSE logs --no-color --tail=60 assistant privacy-shield api 2>&1 | grep -v 'GET /health' | cut -c1-220 | tail -c 2500 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Logs de assistant, shield y api::$body"
      - name: Apagar el stack
        if: always()
        run: $E2E_COMPOSE down -v

# El job 'e2e' levanta el stack entero con transcriptor y LLM falsos (e2e/). Los e2e con Whisper y Ollama reales
# (modelos de varios GB) se ejecutan en local con `make test-e2e`.
