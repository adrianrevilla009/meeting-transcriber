[project]
name = "meeting-transcriber"
version = "0.1.0"
description = "Transcripción local y privada de reuniones (FastAPI + faster-whisper + Postgres)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0", "av>=11,<17"]  # av 17+ quitó metadata_errors, que usa faster-whisper
dev = ["pytest>=8"]
agent = ["PyAudioWPatch>=0.2.12", "numpy", "soundfile", "requests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
